<text x="380.0" y="370" text-anchor="middle" font-size="12" fill="#1f2937">Each filter reports only its strongest response, wherever it happened. That is why 8-mers and 25-mers can share one model.</text>
<text x="380.0" y="388" text-anchor="middle" font-size="11" fill="#6b7280">Illustrative schematic · the real model uses windows 34/32/24/16 with 512 filters each, padded so short peptides still work</text>
